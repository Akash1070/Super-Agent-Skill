name: Daily Autonomous GitHub Scout

on:
  schedule:
    - cron: '0 0 * * *' # Runs every 24 hours at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  auto-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily GitHub Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run scout-daily

      - name: Commit and Push Updated Agent Memory
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Auto-Scout Bot"
          git add data/agent_memory.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-scout): 🤖 update daily agent memory with trending GitHub repos" && git push)
